<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batch Fund — Management System</title>
<style>
:root {
  --primary: #4f46e5;
  --primary-dark: #4338ca;
  --accent: #0d9488;
  --bg: #f8fafc;
  --card-bg: #ffffff;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.07);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-font-smoothing: antialiased;
}

header {
  background: linear-gradient(135deg, #312e81 0%, #4f46e5 100%);
  color: #fff;
  padding: 20px 24px 16px;
  box-shadow: var(--shadow-lg);
}

header h1 {
  font-size: 22px;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.025em;
  display: flex;
  align-items: center;
  gap: 8px;
}

header h1 small {
  font-size: 13px;
  opacity: 0.8;
  font-weight: 400;
  background: rgba(255, 255, 255, 0.15);
  padding: 2px 8px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.2s;
}
header h1 small:hover { background: rgba(255, 255, 255, 0.25); }

button, select, input, textarea { font: inherit; }

.btn {
  background: #ffffff;
  color: var(--primary);
  border: 0;
  border-radius: 8px;
  padding: 8px 14px;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s ease;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); filter: brightness(0.97); }
.btn:active { transform: translateY(0); }

header .btn {
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.25);
  margin: 10px 8px 0 0;
  backdrop-filter: blur(4px);
}
header .btn:hover { background: rgba(255, 255, 255, 0.25); }

.btn.d { background: #ef4444 !important; color: #fff !important; }
.btn.d:hover { background: #dc2626 !important; }

.bar {
  padding: 16px 20px 8px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.chip {
  border: 1px solid var(--border);
  background: var(--card-bg);
  color: var(--text-muted);
  border-radius: 20px;
  padding: 6px 14px;
  font-weight: 500;
  font-size: 13px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s;
}
.chip:hover { border-color: var(--primary); color: var(--primary); }
.chip.on {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
  box-shadow: 0 2px 4px rgba(79, 70, 229, 0.3);
}

.sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

#q {
  flex: 1;
  min-width: 160px;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card-bg);
  font-size: 13px;
  box-shadow: var(--shadow-sm);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
#q:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }

.sum {
  margin: 8px 20px 14px;
  padding: 12px 16px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 10px;
  font-weight: 600;
  font-size: 13px;
  box-shadow: var(--shadow-sm);
  color: #334155;
}

.wrap {
  overflow: auto;
  margin: 0 20px 20px;
  background: var(--card-bg);
  max-height: 66vh;
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow-md);
}

table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  font-size: 13.5px;
}

th, td {
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding: 10px 14px;
  white-space: nowrap;
}

th {
  background: #334155;
  color: #fff;
  text-align: left;
  position: sticky;
  top: 0;
  z-index: 2;
  border-color: rgba(255, 255, 255, 0.1);
  font-weight: 600;
  letter-spacing: 0.02em;
}

th small { display: block; font-weight: 400; opacity: 0.75; font-size: 11px; margin-top: 2px; }

tbody tr { transition: background 0.15s; }
tbody tr:nth-child(even) td { background: #f8fafc; }
tbody tr:hover td { background: #f1f5f9; }

td.nm { cursor: pointer; }
td.id {
  position: sticky;
  left: 0;
  background: var(--card-bg);
  cursor: pointer;
  z-index: 1;
  font-weight: 600;
  box-shadow: 2px 0 5px rgba(0, 0, 0, 0.03);
}
tbody tr:nth-child(even) td.id { background: #f8fafc; }
th.id { left: 0; z-index: 3; background: #334155; }

.tag {
  font-size: 11px;
  border-radius: 6px;
  padding: 2px 8px;
  display: inline-block;
  margin-top: 4px;
  font-weight: 600;
}
.tag.F { background: #fce7f3; color: #db2777; }
.tag.M { background: #e0e7ff; color: #4f46e5; }

td.p { text-align: right; cursor: pointer; min-width: 120px; font-variant-numeric: tabular-nums; }
tbody tr td.pd { background: #dcfce7 !important; color: #15803d; font-weight: 600; }
tbody tr td.pt { background: #fef9c3 !important; color: #a16207; font-weight: 600; }

td.r { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

tfoot td {
  background: #e2e8f0;
  font-weight: 700;
  text-align: right;
  position: sticky;
  bottom: 0;
  z-index: 4;
  color: #1e293b;
  border-top: 2px solid var(--border);
  font-variant-numeric: tabular-nums;
}

#md {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  align-items: center;
  justify-content: center;
  z-index: 99;
  padding: 16px;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

#bx {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 24px;
  width: 100%;
  max-width: 440px;
  max-height: 90vh;
  overflow: auto;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
  animation: scaleUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes scaleUp {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

#bx h3 { font-size: 18px; font-weight: 700; color: var(--text); }
#bx label { display: block; margin: 14px 0 6px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
#bx input, #bx select, #bx textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  background: #f8fafc;
}
#bx input:focus, #bx select:focus, #bx textarea:focus {
  border-color: var(--primary);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
}

.row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.row .btn { background: var(--primary); color: #fff; flex: 1; padding: 10px; }
.row .btn:hover { background: var(--primary-dark); }
.row .btn.g { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); box-shadow: none; }
.row .btn.g:hover { background: #e2e8f0; }

.empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 14px; }
.empty b { color: var(--text); }

@media print {
  header, .bar, #md { display: none; }
  .wrap { max-height: none; overflow: visible; box-shadow: none; border: none; }
  body { background: #fff; }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<!-- Firebase SDK scripts -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>
<header>
  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
    <h1 id="ttl" onclick="checkAdminBefore(ren)"></h1>
    <div id="auth-container" style="display: flex; align-items: center; gap: 10px; font-size: 13px;">
      <span id="user-status" style="opacity: 0.9; font-weight: 500;">Checking access...</span>
      <button class="btn" id="login-btn" onclick="openLoginModal()" style="display: none;">Admin Login</button>
      <button class="btn d" id="logout-btn" onclick="logoutAdmin()" style="display: none;">Logout</button>
    </div>
  </div>
  <div style="margin-top: 12px;">
    <button class="btn" id="btn-add-mem" onclick="checkAdminBefore(addMems)" style="display:none;">+ Members</button>
    <button class="btn" id="btn-add-col" onclick="checkAdminBefore(colForm)" style="display:none;">+ Column</button>
    <button class="btn" onclick="menu()">More ▾</button>
  </div>
</header>
<div class="bar" id="f1"></div>
<div class="sum" id="sum"></div>
<div class="wrap" id="tb"></div>
<div id="md"><div id="bx"><h3 id="mt" style="margin:0 0 12px 0"></h3><div id="mb"></div>
<div class="row"><button class="btn" id="ms">Save</button><button class="btn g" onclick="closeM()">Cancel</button></div></div></div>
<script>
// Firebase configuration and live sync setup
const firebaseConfig = {
  apiKey: "AIzaSyAGgU8TM463tSq1QogY4oCJKQg-6DPxQl4",
  authDomain: "batchfund-f2b19.firebaseapp.com",
  databaseURL: "https://batchfund-f2b19-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "batchfund-f2b19",
  storageBucket: "batchfund-f2b19.firebasestorage.app",
  messagingSenderId: "464580607684",
  appId: "1:464580607684:web:f73e71b50c3519bd259391",
  measurementId: "G-QT5XEEVY79"
};

firebase.initializeApp(firebaseConfig);
const dbRef = firebase.database().ref('batchfund_data');

// --- AUTHENTICATION & LOGIN LOGIC ---
const auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.error);

// Paste your Firebase User UID inside these quotes:
const adminUids = [
  "fLeo9uuxd4ZdhbEQoxge9QCS0wR2"
];

let isAdmin = false;

function checkAdminBefore(actionFn, arg1, arg2) {
  if (!isAdmin) {
    alert("Only admins have access to edit or make changes.");
    return;
  }
  return actionFn(arg1, arg2);
}

function openLoginModal() {
  modal('Admin Login', `
    <label>Email Address</label>
    <input id="login-email" type="email" placeholder="admin@example.com">
    <label>Password</label>
    <input id="login-pass" type="password" placeholder="Enter password">
  `, () => {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;
    if (!email || !pass) { alert("Please fill in both fields."); return false; }
    auth.signInWithEmailAndPassword(email, pass)
      .then(() => { closeM(); })
      .catch((error) => { alert("Login failed: " + error.message); return false; });
  });
  $('ms').textContent = 'Login';
}
  
function logoutAdmin() {
  auth.signOut().then(() => alert("Logged out successfully."));
}

auth.onAuthStateChanged((user) => {
  isAdmin = user && adminUids.includes(user.uid);

  ['btn-add-mem', 'btn-add-col'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = isAdmin ? 'inline-block' : 'none';
  });

  if (isAdmin) {
    $('user-status').innerText = `Admin: ${user.displayName || user.email}`;
    $('login-btn').style.display = 'none';
    $('logout-btn').style.display = 'inline-block';
  } else {
    if (user) {
      alert("Access Denied: This account is not on the authorized admin list.");
      auth.signOut();
    }
    $('user-status').innerText = "View-Only Mode";
    $('login-btn').style.display = 'inline-block';
    $('logout-btn').style.display = 'none';
  }
  render();
});
// --- END OF AUTH LOGIC ---

let S = {cols:[{id:'c1',name:'Month 1',amt:1000}],mem:[],pay:{}};
let F={g:'all',s:'all',q:''};
const $=i=>document.getElementById(i);

const save = () => {
  dbRef.set(S).catch(e => alert('Could not save to cloud!'));
};

dbRef.on('value', (snapshot) => {
  const data = snapshot.val();
  if (data) {
    S = {
      title: data.title || '23/24 Batch Fund',
      cols: data.cols || [],
      mem: data.mem || [],
      pay: data.pay || {}
    };
    render();
  } else {
    save();
  }
});

const fmt=n=>'LKR '+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strm=r=>/BST/i.test(r)?'BST':/ICT/i.test(r)?'ICT':'Other';
const getM=id=>S.mem.find(m=>m.id==id), getC=id=>S.cols.find(c=>c.id==id);

function rows(){const q=F.q.toLowerCase();return S.mem.filter(m=>(F.g=='all'||m.g==F.g)&&(F.s=='all'||m.s==F.s)&&(m.name+m.reg).toLowerCase().includes(q))}
function calc(m){let p=0,d=0;S.cols.forEach(c=>{const v=(S.pay[m.id]||{})[c.id];if(v!=null){p+=v;d+=Math.max(0,c.amt-v)}else d+=c.amt});return{p,d}}

function render(kb){
 $('ttl').innerHTML=esc(S.title||'23/24 Batch Fund')+' <small>✎ Edit Title</small>';
 const chips=(k,arr)=>arr.map(([v,l])=>`<button class="chip ${F[k]==v?'on':''}" onclick="F.${k}='${v}';render()">${l}</button>`).join('');
 if(!kb)$('f1').innerHTML=chips('g',[['all','All'],['F','Girls'],['M','Boys']])+'<span class="sep"></span>'+chips('s',[['all','All'],['ICT','ICT'],['BST','BST']])+`<input id="q" placeholder="Search name / reg no..." value="${esc(F.q)}" oninput="F.q=this.value;render(1)">`;
 const R=rows();
 if(!S.mem.length){$('tb').innerHTML='<div class="empty">No members yet.<br>Tap <b>+ Members</b> above and paste records from Excel.</div>';$('sum').textContent='';return}
 let h='<table><thead><tr><th>#</th><th class="id">Reg No</th><th>Full Name</th>';
 S.cols.forEach(c=>h+=`<th onclick="colForm('${c.id}')" style="cursor:pointer">${esc(c.name)}<small>${fmt(c.amt)} ✎</small></th>`);
 h+='<th>Total Paid</th><th>Due</th></tr></thead><tbody>';
 const T={};S.cols.forEach(c=>T[c.id]=0);let tp=0,td=0;
 R.forEach((m,i)=>{const t=calc(m);tp+=t.p;td+=t.d;
  h+=`<tr><td>${i+1}</td><td class="id" onclick="memForm('${m.id}')">${esc(m.reg.slice(-7))}</td><td class="nm" onclick="memForm('${m.id}')">${esc(m.name)}<span class="tag ${m.g}">${m.g=='F'?'Girl':'Boy'} · ${m.s}</span></td>`;
  S.cols.forEach(c=>{const v=(S.pay[m.id]||{})[c.id];if(v!=null)T[c.id]+=v;
   h+=`<td class="p ${v==null?'':v>=c.amt?'pd':'pt'}" onclick="payForm('${m.id}','${c.id}')">${v==null?'':fmt(v)}</td>`});
  h+=`<td class="r">${fmt(t.p)}</td><td class="r">${t.d?fmt(t.d):'—'}</td></tr>`});
 h+='</tbody><tfoot><tr><td colspan="3">TOTAL ('+R.length+' members)</td>';
 S.cols.forEach(c=>h+=`<td>${fmt(T[c.id])}</td>`);
 h+=`<td>${fmt(tp)}</td><td>${fmt(td)}</td></tr></tfoot></table>`;
 $('tb').innerHTML=h;
 $('sum').textContent=`Collected: ${fmt(tp)}  |  Still due: ${fmt(td)}  |  Not fully paid: ${R.filter(m=>calc(m).d>0).length} of ${R.length}`;
}

let onSave=null;
function modal(t,html,fn){$('mt').textContent=t;$('mb').innerHTML=html;$('md').style.display='flex';onSave=fn;$('ms').textContent='Save';$('ms').style.display=fn?'':'none'}
function closeM(){$('md').style.display='none'}
$('ms').onclick=()=>{if(onSave&&onSave()!==false)closeM()};

function payForm(mid,cid){
  if (!isAdmin) return; // Does nothing if clicked by a non-admin
  const m=getM(mid),c=getC(cid),v=(S.pay[mid]||{})[cid];
  modal(m.name+' — '+c.name,`<label>Amount paid (LKR)</label><input id="a" type="number" inputmode="decimal" value="${v!=null?v:c.amt}"><div class="row"><button class="btn g" onclick="clearPay('${mid}','${cid}')" style="flex:1">Mark NOT paid</button></div>`,()=>{
    const n=parseFloat($('a').value);if(isNaN(n)||n<0)return false;(S.pay[mid]=S.pay[mid]||{})[cid]=n;save();render()});setTimeout(()=>$('a').select(),50)
}
function clearPay(mid,cid){if(S.pay[mid])delete S.pay[mid][cid];save();render();closeM()}

function colForm(id){
  if (!isAdmin) return; // Does nothing if clicked by a non-admin
  const c = id?getC(id):{name:'',amt:1000};
  modal(id?'Edit column':'New column',`<label>Column name (e.g. January, Trip)</label><input id="n" value="${esc(c.name)}"><label>Amount per person (LKR)</label><input id="a" type="number" value="${c.amt}">${id?`<div class="row"><button class="btn d" onclick="delCol('${id}')">Delete column</button></div>`:''}`,()=>{
    const n=$('n').value.trim(),a=parseFloat($('a').value);if(!n||isNaN(a))return false;
    if(id){c.name=n;c.amt=a}else S.cols.push({id:uid(),name:n,amt:a});save();render()})
}
function delCol(id){if(!confirm('Delete this column and its payments?'))return;S.cols=S.cols.filter(c=>c.id!=id);Object.values(S.pay).forEach(p=>delete p[id]);save();render();closeM()}

function memForm(id){
  if (!isAdmin) return; // Does nothing if clicked by a non-admin
  const m=getM(id);
  modal('Edit member',`<label>Registration Number</label><input id="r" value="${esc(m.reg)}"><label>Full Name</label><input id="n" value="${esc(m.name)}"><label>Gender</label><select id="g"><option value="F" ${m.g=='F'?'selected':''}>Girl</option><option value="M" ${m.g=='M'?'selected':''}>Boy</option></select><label>Stream</label><select id="s">${['ICT','BST','Other'].map(x=>`<option ${m.s==x?'selected':''}>${x}</option>`).join('')}</select><div class="row"><button class="btn d" onclick="delMem('${id}')">Delete member</button></div>`,()=>{
    m.reg=$('r').value.trim();m.name=$('n').value.trim();m.g=$('g').value;m.s=$('s').value;save();render()})
}
function delMem(id){if(!confirm('Delete this member and all their payments?'))return;S.mem=S.mem.filter(m=>m.id!=id);delete S.pay[id];save();render();closeM()}

function addMems(){modal('Add members',`<label>Paste from Excel (Registration Number, then Name — one person per line)</label><textarea id="t" rows="8"></textarea><label>These people are</label><select id="g"><option value="F">Girls</option><option value="M">Boys</option></select><label>Stream</label><select id="s"><option>ICT</option><option>BST</option><option value="auto">Detect from registration number</option></select>`,()=>{
  const L=$('t').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!L.length)return false;
  L.forEach(l=>{let p=l.split('\t');if(p.length<2)p=l.split(/\s{2,}|,/);let reg='',name=l;
   if(p.length>=2){reg=p[0].trim();name=p.slice(1).join(' ').trim()}
   if(/^registration/i.test(reg))return;S.mem.push({id:uid(),reg,name,g:$('g').value,s:$('s').value=='auto'?strm(reg):$('s').value})});
  save();render()})}

function menu(){modal('More options',`<div class="row" style="flex-direction:column">
<button class="btn" onclick="closeM();shareCSV()" style="width:100%;text-align:left;background:#f8fafc;color:var(--text);border:1px solid var(--border)">📥 Share report (CSV for Excel)</button>
<button class="btn" onclick="closeM();shareUnpaid()" style="width:100%;text-align:left;background:#f8fafc;color:var(--text);border:1px solid var(--border)">📋 Share "not paid" list (text)</button>
<button class="btn" onclick="closeM();sharePDF()" style="width:100%;text-align:left;background:#f8fafc;color:var(--text);border:1px solid var(--border)">📄 Share report as PDF</button>
<button class="btn" onclick="closeM();backup()" style="width:100%;text-align:left;background:#f8fafc;color:var(--text);border:1px solid var(--border)">💾 Backup all data</button>
<button class="btn" onclick="restoreForm()" style="width:100%;text-align:left;background:#f8fafc;color:var(--text);border:1px solid var(--border)">📂 Restore from backup</button></div>`)}

async function makePDF(cols,ex){
 if(!(window.jspdf&&jspdf.jsPDF)){window.print();return}
 const cl=m=>{let p=0,d=0;cols.forEach(c=>{const v=(S.pay[m.id]||{})[c.id];if(v!=null){p+=v;d+=Math.max(0,c.amt-v)}else d+=c.amt});return{p,d}};const R=rows(),n=cols.length,doc=new jspdf.jsPDF({orientation:n>3?'landscape':'portrait',unit:'pt',format:'a4'});
 doc.setFontSize(16);doc.text(S.title||'Batch Fund',40,40);doc.setFontSize(10);doc.setTextColor(90);
 doc.text(`${{all:'All members',F:'Girls',M:'Boys'}[F.g]} | ${F.s=='all'?'ICT & BST':F.s} | ${today()}`,40,58);
 const raw=R.map(m=>cols.map(c=>(S.pay[m.id]||{})[c.id]));
 const T=cols.map(c=>R.reduce((a,m)=>a+((S.pay[m.id]||{})[c.id]||0),0));let tp=0,td=0;
 const body=R.map((m,i)=>{const t=cl(m);tp+=t.p;td+=t.d;return[i+1,m.reg,m.name,...raw[i].map(v=>v==null?'':fmt(v)),...(ex?[fmt(t.p),t.d?fmt(t.d):'-']:[])]});
 doc.autoTable({startY:70,head:[['#','Reg No','Full Name',...cols.map(c=>c.name+'\n'+fmt(c.amt)),...(ex?['Total Paid','Due']:[])]],body,foot:[['','','TOTAL ('+R.length+')',...T.map(fmt),...(ex?[fmt(tp),fmt(td)]:[])]],
  styles:{fontSize:8,cellPadding:4,lineColor:[213,219,229],lineWidth:.5},headStyles:{fillColor:[49,46,129]},footStyles:{fillColor:[226,232,240],textColor:20},
  didParseCell:d=>{if(d.section=='body'&&d.column.index>=3&&d.column.index<3+n){const v=raw[d.row.index][d.column.index-3],c=cols[d.column.index-3];d.cell.styles.halign='right';if(v!=null)d.cell.styles.fillColor=v>=c.amt?[220,252,231]:[254,249,195]}}});
 const name='fund-report-'+today()+'.pdf',P=window.Capacitor&&Capacitor.Plugins;
 try{if(P&&P.Filesystem&&P.Share){const r=await P.Filesystem.writeFile({path:name,data:doc.output('datauristring').split(',')[1],directory:'CACHE'});await P.Share.share({title:name,url:r.uri})}else doc.save(name)}catch(e){alert('PDF failed: '+e.message)}}
function sharePDF(){const L='color:#1e293b;font-size:14px;font-weight:500;display:block;margin:8px 0';modal('PDF columns','<label>Choose what to include</label>'+S.cols.map(c=>`<label style="${L}"><input type="checkbox" class="pc" value="${c.id}" checked style="width:auto;margin-right:8px">${esc(c.name)} (${fmt(c.amt)})</label>`).join('')+`<label style="${L}"><input type="checkbox" id="ex" checked style="width:auto;margin-right:8px">Total Paid &amp; Due</label>`,()=>{const ids=[...document.querySelectorAll('.pc:checked')].map(x=>x.value);if(!ids.length){alert('Select at least one column');return false}makePDF(S.cols.filter(c=>ids.includes(c.id)),$('ex').checked)});$('ms').textContent='Create PDF'}
function ren(){modal('Rename fund',`<label>Title</label><input id="n" value="${esc(S.title||'')}">`,()=>{S.title=$('n').value.trim();save();render()})}
async function shareFile(name,text,mime){const P=window.Capacitor&&Capacitor.Plugins;
 try{if(P&&P.Filesystem&&P.Share){const r=await P.Filesystem.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});await P.Share.share({title:name,url:r.uri})}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click()}}catch(e){alert('Share failed: '+e.message)}}
async function shareText(t){const P=window.Capacitor&&Capacitor.Plugins;
 if(P&&P.Share)try{await P.Share.share({text:t})}catch(e){}else{navigator.clipboard&&navigator.clipboard.writeText(t);alert('Copied to clipboard')}}
const today=()=>new Date().toISOString().slice(0,10);
function shareCSV(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 let c=[['Registration Number','Full Name','Gender','Stream',...S.cols.map(c=>c.name+' ('+c.amt+')'),'Total Paid','Due'].map(q).join(',')];
 rows().forEach(m=>{const t=calc(m);c.push([m.reg,m.name,m.g=='F'?'Girl':'Boy',m.s,...S.cols.map(x=>{const v=(S.pay[m.id]||{})[x.id];return v==null?'':v}),t.p,t.d].map(q).join(','))});
 shareFile('fund-report-'+today()+'.csv','\ufeff'+c.join('\n'),'text/csv')}
function shareUnpaid(){const R=rows().filter(m=>calc(m).d>0);
 shareText(`NOT PAID LIST (${today()})\n`+R.map((m,i)=>`${i+1}. ${m.name} (${m.reg}) - due ${fmt(calc(m).d)}`).join('\n')+`\n\nTotal due: ${fmt(R.reduce((a,m)=>a+calc(m).d,0))}`)}
function backup(){shareFile('batchfund-backup-'+today()+'.json',JSON.stringify(S),'application/json')}
function restoreForm(){modal('Restore backup','<label>Choose the backup file</label><input id="fl" type="file"><label>…or paste the backup text</label><textarea id="t" rows="4"></textarea>',()=>{
  const go=txt=>{try{const d=JSON.parse(txt);if(!d.cols||!d.mem)throw 0;if(confirm('Replace ALL current data with this backup?')){S=d;dbRef.set(S).then(()=>render()).catch(e=>alert('Cloud save failed: '+e.message));}}catch(e){alert('Invalid backup')}};
  const f=$('fl').files[0];if(f){const r=new FileReader();r.onload=()=>go(r.result);r.readAsText(f)}else if($('t').value.trim())go($('t').value);else return false})}
</script>
</body>
</html>
